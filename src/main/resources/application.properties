spring.application.name=gestion-polizas
server.port=8080

spring.datasource.url=jdbc:h2:mem:polizasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Valor ilustrativo para la prueba. Debe sustituirse por el IPC oficial/configurado del negocio.
app.ipc-porcentaje=5.2
app.api-key=123456
logging.level.co.com.segurosbolivar=INFO
